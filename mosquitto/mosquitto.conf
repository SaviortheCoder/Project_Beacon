# Development broker for B.E.A.C.O.N. (no TLS, no passwords).
# Run:  mosquitto -c mosquitto/mosquitto.conf -v
# Then: MQTT_URL=mqtt://localhost:1883 npm start
#
# Before deployment (Section 8.5): port 8883 with TLS, one client certificate per station
# (require_certificate true, use_identity_as_username true) and an acl_file that lets each
# station use only beacon/<its id>/#.
listener 1883
allow_anonymous true
persistence true
persistence_location ./data/
